<title>StudyFlow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;500;700&family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,500;0,700;0,800;1,400&family=Schibsted+Grotesk:wght@600;700;800;900&display=swap">
<style>
/*CSS*/
</style>
<div class="app">
  <aside class="sidebar" aria-label="Main">
    <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h9.5a3 3 0 0 1 0 6h-5a3 3 0 0 0 0 6H19"/></svg></span>StudyFlow</div>
    <nav class="nav">
      <button type="button" data-act="nav" data-nav="today"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
      <button type="button" data-act="nav" data-nav="subjects"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5V5a2 2 0 0 1 2-2h14v15H6a2 2 0 0 0-2 2zm0 0a2 2 0 0 0 2 2h14"/></svg>Subjects</button>
      <button type="button" data-act="nav" data-nav="revision"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="14" height="14" rx="2"/><path d="M7 7V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-2"/></svg>Revision<span class="count" data-due-count hidden></span></button>
      <button type="button" data-act="nav" data-nav="assignments"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3"/><rect x="9" y="2.5" width="6" height="3.5" rx="1"/><path d="M8.5 14l2.5 2.5 4.5-5"/></svg>Assignments</button>
      <button type="button" data-act="nav" data-nav="progress"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V11M10 20V5M16 20v-6M21 20H3"/></svg>Progress</button>
    </nav>
    <div class="side-xp" id="side-xp"></div>
    <div class="side-foot">
      <button type="button" data-act="go" data-view="settings"><svg class="ico ico-sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Settings</button>
      <div class="save-state" id="save-state"><i></i><span>Loading…</span></div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="topbar-in">
        <div class="mobile-brand"><div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h9.5a3 3 0 0 1 0 6h-5a3 3 0 0 0 0 6H19"/></svg></span>StudyFlow</div>
          <button type="button" class="btn ghost sm" data-act="go" data-view="settings" aria-label="Settings"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button></div>
        <form class="qc" data-form="qc" autocomplete="off">
          <div class="qc-box"><svg class="ico plus" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            <input id="qc-input" name="q" data-input="qc" placeholder="Add homework, a test or an activity: “bio test thu”" aria-label="Quick add" enterkeyhint="done">
            <button class="btn primary sm" type="submit">Add</button></div>
          <div class="qc-preview" id="qc-prev" hidden aria-live="polite"></div>
        </form>
        <button type="button" class="iconbtn" data-act="search" aria-label="Search" title="Search (Ctrl K)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
      </div>
    </header>
    <div class="content">
      <div id="banner"></div>
      <main id="view"></main>
    </div>
  </div>
  <nav class="bottomnav" aria-label="Main">
    <button type="button" data-act="nav" data-nav="today"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
    <button type="button" data-act="nav" data-nav="subjects"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5V5a2 2 0 0 1 2-2h14v15H6a2 2 0 0 0-2 2zm0 0a2 2 0 0 0 2 2h14"/></svg>Subjects</button>
    <button type="button" data-act="nav" data-nav="revision"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="14" height="14" rx="2"/><path d="M7 7V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-2"/></svg>Revision<span class="dot" data-due-count hidden></span></button>
    <button type="button" data-act="nav" data-nav="assignments"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3"/><rect x="9" y="2.5" width="6" height="3.5" rx="1"/><path d="M8.5 14l2.5 2.5 4.5-5"/></svg>Tasks</button>
    <button type="button" data-act="nav" data-nav="progress"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V11M10 20V5M16 20v-6M21 20H3"/></svg>Progress</button>
  </nav>
</div>
<div id="modal" class="modal" hidden></div>
<div id="focus" class="focus" hidden role="dialog" aria-modal="true" aria-label="Focus session"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<canvas id="confetti" class="confetti" hidden aria-hidden="true"></canvas>

/*JS*/
