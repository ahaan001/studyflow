<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="StudyFlow plans your school week around your real free time, finds weak topics before tests, and breaks assignments into steps.">
<meta name="theme-color" content="#1f3a73">

<title>StudyFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;500;700&family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,500;0,700;0,800;1,400&family=Schibsted+Grotesk:wght@600;700;800;900&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: app shell. Desktop = fixed sidebar + scrolling main column (max 1180px, 12-col feel via grid areas).
   Phone (<860px) = top quick-capture bar + content + fixed bottom nav. */
:root {
  --bg: #f3f5f9;
  --surface: #ffffff;
  --surface-2: #eceff5;
  --surface-3: #e2e7f0;
  --ink: #121a2e;
  --ink-2: #444e69;
  --ink-3: #5e6884;
  --line: #dce1ea;
  --accent: #1f3a73;
  --accent-2: #2b55a8;
  --accent-ink: #ffffff;
  --accent-soft: #e3e9f6;
  --hi: #ffc93c;
  --hi-ink: #3a2a00;
  --good: #187a43;
  --good-soft: #e1f3e8;
  --warn: #9a5b00;
  --warn-soft: #fff0d4;
  --crit: #b8322b;
  --crit-soft: #fbe5e3;
  --info-soft: #e5eeff;
  --c1: #2f6bff;
  --c2: #f0533f;
  --c3: #12a36b;
  --c4: #7b5cff;
  --c5: #ff8a1f;
  --c6: #0fa3b1;
  --c7: #e2407e;
  --c8: #c99700;
  --shadow: 0 1px 2px rgba(18, 26, 46, 0.06), 0 4px 16px rgba(18, 26, 46, 0.05);
  --shadow-lg: 0 10px 40px rgba(18, 26, 46, 0.18);
  --f-display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Atkinson Hyperlegible Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 6px;
  --r-sm: 4px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1120; --surface: #141b2d; --surface-2: #1b2338; --surface-3: #232d46; --ink: #e9edf6; --ink-2: #b3bbd0; --ink-3: #96a0b8;
    --line: #29334c; --accent: #a8c0ff; --accent-2: #c6d6ff; --accent-ink: #0c1120; --accent-soft: #1e2a49; --hi: #ffd25e; --hi-ink: #2a1e00;
    --good: #57c98c; --good-soft: #14302a; --warn: #f2b04a; --warn-soft: #33270f; --crit: #ff8478; --crit-soft: #3a1d1e; --info-soft: #1a2747;
    --c1: #7aa0ff; --c2: #ff806e; --c3: #43cf93; --c4: #a790ff; --c5: #ffa35a; --c6: #45c9d6; --c7: #ff78a8; --c8: #ecc445;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.25); --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1120; --surface: #141b2d; --surface-2: #1b2338; --surface-3: #232d46; --ink: #e9edf6; --ink-2: #b3bbd0; --ink-3: #96a0b8;
  --line: #29334c; --accent: #a8c0ff; --accent-2: #c6d6ff; --accent-ink: #0c1120; --accent-soft: #1e2a49; --hi: #ffd25e; --hi-ink: #2a1e00;
  --good: #57c98c; --good-soft: #14302a; --warn: #f2b04a; --warn-soft: #33270f; --crit: #ff8478; --crit-soft: #3a1d1e; --info-soft: #1a2747;
  --c1: #7aa0ff; --c2: #ff806e; --c3: #43cf93; --c4: #a790ff; --c5: #ffa35a; --c6: #45c9d6; --c7: #ff78a8; --c8: #ecc445;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.25); --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; line-height: 1.15; text-wrap: balance; color: var(--ink); }
h1 { font-size: clamp(28px, 4vw, 40px); font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
h3 { font-size: 17px; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent-2); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: 14px; }
.tiny { font-size: 13px; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-sm { display: flex; flex-direction: column; gap: 8px; }
.row-flex { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }
.ico { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ico-sm { width: 16px; height: 16px; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }
.sidebar {
  position: sticky; top: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 24px;
  padding: calc(20px + env(safe-area-inset-top, 0px)) 16px 20px max(16px, env(safe-area-inset-left, 0px));
  background: var(--surface); border-right: 1px solid var(--line); overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 900; font-size: 22px; letter-spacing: -0.03em; color: var(--ink); padding: 0 8px; }
.brand-mark { width: 30px; height: 30px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); }
.brand-mark svg { width: 18px; height: 18px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border: 0; border-radius: var(--r);
  background: transparent; color: var(--ink-2); font-weight: 700; font-size: 15px; text-align: left;
}
.nav button:hover { background: var(--surface-2); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
.nav .count { margin-left: auto; font-family: var(--f-mono); font-size: 12px; padding: 1px 7px; border-radius: 99px; background: var(--hi); color: var(--hi-ink); }
.side-xp { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: var(--r); background: var(--surface-2); }
.side-xp .lvl { display: flex; align-items: baseline; justify-content: space-between; font-weight: 700; }
.side-xp .lvl b { font-family: var(--f-display); font-size: 20px; font-weight: 900; }
.xpbar { height: 8px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.xpbar i { display: block; height: 100%; background: var(--hi); border-radius: 99px; }
.side-foot { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--ink-3); padding: 0 4px; }
.side-foot button { background: none; border: 0; padding: 4px 0; text-align: left; color: var(--ink-2); font-weight: 700; display: flex; gap: 8px; align-items: center; }
.save-state { display: flex; align-items: center; gap: 6px; }
.save-state i { width: 8px; height: 8px; border-radius: 99px; background: var(--good); }
.save-state.local i { background: var(--warn); }
.save-state.err i { background: var(--crit); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg);
  padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid transparent;
}
.topbar.scrolled { border-bottom-color: var(--line); }
.topbar-in { max-width: 1180px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-start; }
.qc { flex: 1; min-width: 0; position: relative; }
.qc-box { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); padding: 0 6px 0 12px; box-shadow: var(--shadow); }
.qc-box:focus-within { border-color: var(--accent-2); }
.qc-box input { flex: 1; min-width: 0; border: 0; background: transparent; height: 46px; outline: none; font-size: 16px; }
.qc-box .plus { color: var(--accent-2); }
.qc-preview { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow-lg); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; z-index: 30; }
.qc-preview .hint { font-size: 13px; color: var(--ink-3); }
.iconbtn { width: 46px; height: 46px; flex: none; display: grid; place-items: center; border-radius: var(--r); border: 1.5px solid var(--line); background: var(--surface); color: var(--ink-2); box-shadow: var(--shadow); }
.iconbtn:hover { color: var(--ink); border-color: var(--ink-3); }
.mobile-brand { display: none; }

.content { flex: 1; width: 100%; max-width: 1180px; margin: 0 auto; padding-block: 8px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; padding: 12px 16px; border-radius: var(--r); background: var(--hi); color: var(--hi-ink); margin-bottom: 20px; font-weight: 700; }
.banner .btn { background: var(--hi-ink); color: var(--hi); border-color: transparent; }

.bottomnav { display: none; }

/* ---------- primitives ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 8px 14px; border-radius: var(--r);
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 700; font-size: 15px; white-space: nowrap;
}
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn.hi { background: var(--hi); border-color: var(--hi); color: var(--hi-ink); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn.danger { color: var(--crit); }
.btn.danger.solid { background: var(--crit); border-color: var(--crit); color: #fff; }
.btn.sm { min-height: 32px; padding: 4px 10px; font-size: 14px; }
.btn.xs { min-height: 28px; padding: 2px 8px; font-size: 13px; border-radius: var(--r-sm); }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.btn.ai { border-color: var(--accent-soft); background: var(--accent-soft); color: var(--accent); }
.btn.ai:hover { border-color: var(--accent-2); }

.panel { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 20px; min-width: 0; }
.panel.flush { padding: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.panel-head h2, .panel-head h3 { display: flex; align-items: center; gap: 8px; }
.empty { padding: 28px 16px; text-align: center; color: var(--ink-2); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty h3 { color: var(--ink); }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 7px; border-radius: 99px; font-size: 13px; font-weight: 700; background: color-mix(in srgb, var(--sc, var(--ink-3)) 15%, var(--surface)); color: var(--ink); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.chip > span { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 99px; background: var(--sc, var(--ink-3)); flex: none; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; font-size: 13px; font-weight: 700; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.info { background: var(--accent-soft); color: var(--accent); }
.pill.hi { background: var(--hi); color: var(--hi-ink); }
.tag { display: inline-flex; padding: 1px 7px; border-radius: var(--r-sm); font-size: 12px; font-weight: 700; letter-spacing: 0.03em; background: var(--surface-2); color: var(--ink-2); }
[data-sc="c1"] { --sc: var(--c1); } [data-sc="c2"] { --sc: var(--c2); } [data-sc="c3"] { --sc: var(--c3); } [data-sc="c4"] { --sc: var(--c4); }
[data-sc="c5"] { --sc: var(--c5); } [data-sc="c6"] { --sc: var(--c6); } [data-sc="c7"] { --sc: var(--c7); } [data-sc="c8"] { --sc: var(--c8); }

.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); min-width: 0; }
.li:first-child { border-top: 0; }
.li.click { cursor: pointer; }
.li.click:hover .li-title { color: var(--accent-2); }
.li-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.li-title { font-weight: 700; overflow-wrap: anywhere; }
.li-sub { font-size: 14px; color: var(--ink-2); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.li-side { display: flex; align-items: center; gap: 6px; flex: none; flex-wrap: wrap; justify-content: flex-end; }

.tabs { display: flex; gap: 4px; border-bottom: 1.5px solid var(--line); margin-bottom: 20px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: none; border: 0; background: none; padding: 10px 12px; font-weight: 700; color: var(--ink-2); border-bottom: 3px solid transparent; margin-bottom: -1.5px; font-size: 15px; display: flex; gap: 6px; align-items: center; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs .count { font-family: var(--f-mono); font-size: 12px; padding: 0 6px; border-radius: 99px; background: var(--surface-2); }

.seg { display: inline-flex; background: var(--surface-2); border-radius: var(--r); padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 5px 10px; border-radius: var(--r-sm); font-weight: 700; font-size: 14px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; background: var(--accent-2); }
.bar.thin { height: 5px; }
.bar .s-mastered { background: var(--good); } .bar .s-good { background: color-mix(in srgb, var(--good) 55%, var(--surface)); }
.bar .s-revise { background: var(--warn); } .bar .s-learning { background: var(--accent-2); } .bar .s-weak { background: var(--crit); } .bar .s-ns { background: var(--surface-3); }

/* ---------- forms ---------- */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span, .label { font-size: 14px; font-weight: 700; color: var(--ink-2); }
.input, select.input, textarea.input {
  width: 100%; min-height: 42px; padding: 8px 11px; border-radius: var(--r); border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); outline: none;
}
textarea.input { min-height: 96px; resize: vertical; line-height: 1.5; }
.input:focus { border-color: var(--accent-2); }
.input.sm { min-height: 34px; padding: 4px 8px; font-size: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--accent-2); flex: none; }
.daychips { display: flex; gap: 4px; flex-wrap: wrap; }
.daychips label { position: relative; }
.daychips input { position: absolute; opacity: 0; inset: 0; }
.daychips span { display: inline-grid; place-items: center; min-width: 42px; height: 34px; border-radius: var(--r-sm); border: 1.5px solid var(--line); font-weight: 700; font-size: 14px; color: var(--ink-2); cursor: pointer; }
.daychips input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.daychips input:focus-visible + span { outline: 2px solid var(--accent-2); outline-offset: 2px; }
.pickchips { display: flex; flex-wrap: wrap; gap: 8px; }
.pickchips button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 14px; font-weight: 700; color: var(--ink-2); }
.pickchips button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* ---------- page header ---------- */
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin: 12px 0 24px; }
.page-head .sub { color: var(--ink-2); margin-top: 6px; font-size: 17px; }
.back { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--ink-2); font-weight: 700; padding: 4px 0; margin-bottom: 8px; }

/* ---------- today ---------- */
.today-grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.today-side { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.loadpill { font-size: 14px; }
.strip-wrap { margin: 4px 0 18px; }
.strip { position: relative; height: 46px; background: var(--surface-2); border-radius: var(--r); overflow: hidden; }
.strip .blk { position: absolute; top: 6px; bottom: 6px; border-radius: var(--r-sm); background: var(--sc, var(--accent-2)); opacity: 0.92; display: flex; align-items: center; padding: 0 6px; overflow: hidden; }
.strip .blk span { font-size: 12px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip .blk.done { opacity: 0.35; }
.strip .act { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, var(--surface-3) 0 6px, transparent 6px 12px); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.strip .act span { font-size: 12px; font-weight: 700; color: var(--ink-2); background: var(--surface-2); padding: 1px 6px; border-radius: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 95%; }
.strip .now { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--crit); }
.strip .past { position: absolute; top: 0; bottom: 0; left: 0; background: color-mix(in srgb, var(--surface-3) 60%, transparent); }
.ticks { position: relative; height: 18px; margin-top: 4px; }
.ticks span { position: absolute; transform: translateX(-50%); font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); }
.ticks span:first-child { transform: none; }
.ticks span:last-child { transform: translateX(-100%); }

.sess { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); }
.sess:first-child { border-top: 0; }
.sess .time { font-family: var(--f-mono); font-weight: 700; font-size: 15px; line-height: 1.2; }
.sess .time small { display: block; font-weight: 400; color: var(--ink-3); font-size: 12px; }
.sess .t { font-weight: 700; overflow-wrap: anywhere; }

.menu-wrap { position: relative; }

.alert { display: flex; gap: 10px; padding: 12px; border-radius: var(--r); background: var(--surface-2); font-size: 15px; align-items: flex-start; }

.alert.warn { background: var(--warn-soft); }

.week { display: flex; flex-direction: column; }
.week .wd { display: grid; grid-template-columns: 92px minmax(0, 1fr) 64px; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); align-items: center; }
.week .wd:first-child { border-top: 0; }
.week .wd .chips { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }

/* ---------- subjects ---------- */
.subj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.subj-card { position: relative; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; display: flex; flex-direction: column; gap: 14px; cursor: pointer; border: 1.5px solid transparent; text-align: left; overflow: hidden; }

.swatch { width: 14px; height: 14px; border-radius: 4px; background: var(--sc); flex: none; }
.subj-card .grade { display: flex; align-items: baseline; gap: 8px; }

.chapter { padding: 6px 0 14px; }

.topic { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 16px; padding: 10px 0; border-top: 1px solid var(--line); align-items: center; }

.gtable { width: 100%; border-collapse: collapse; font-size: 15px; }

.calc { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }

/* ---------- revision ---------- */
.wm-summary { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }

.tile { text-align: left; border: 1.5px solid transparent; border-radius: var(--r); padding: 10px; min-height: 74px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; font-weight: 700; font-size: 14px; color: var(--ink); background: var(--surface-2); }

.tile:hover { border-color: var(--ink-3); }
.sw-mastered { background: var(--good); } .sw-good { background: color-mix(in srgb, var(--good) 45%, var(--surface)); } .sw-revise { background: var(--warn); }
.sw-learning { background: var(--accent-2); } .sw-weak { background: var(--crit); } .sw-ns { background: transparent; border: 1.5px dashed var(--ink-3); }

.review { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.qcard { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 28px; display: flex; flex-direction: column; gap: 18px; min-height: 280px; }
.qcard .q { font-family: var(--f-display); font-size: clamp(21px, 3vw, 27px); font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.qcard .a { font-size: 18px; line-height: 1.55; padding: 16px; border-radius: var(--r); background: var(--good-soft); overflow-wrap: anywhere; }
.qcard .mine { font-size: 15px; padding: 12px; border-radius: var(--r); background: var(--surface-2); }
.rate { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.rate button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 6px; border-radius: var(--r); border: 1.5px solid var(--line); background: var(--surface); font-weight: 800; font-size: 15px; }
.rate button small { font-family: var(--f-mono); font-weight: 400; font-size: 12px; color: var(--ink-3); }
.rate button.again { border-color: var(--crit); color: var(--crit); }
.rate button.hard { border-color: var(--warn); color: var(--warn); }
.rate button.good { border-color: var(--good); color: var(--good); }
.rate button.easy { border-color: var(--accent-2); color: var(--accent-2); }
.rprog { display: flex; align-items: center; gap: 12px; }
.rprog .bar { flex: 1; }
.feedback { padding: 12px 14px; border-radius: var(--r); font-size: 15px; }
.feedback.correct { background: var(--good-soft); }
.feedback.partly { background: var(--warn-soft); }
.feedback.incorrect { background: var(--crit-soft); }
.ai-box { padding: 16px; border-radius: var(--r); background: var(--accent-soft); display: flex; flex-direction: column; gap: 10px; }
.ai-box .ai-label { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }

.mistake { padding: 14px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.mistake:first-child { border-top: 0; }
.mistake .mq { font-weight: 700; overflow-wrap: anywhere; }
.mistake .ma { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; font-size: 15px; }
.mistake .ma div { padding: 8px 10px; border-radius: var(--r-sm); background: var(--surface-2); overflow-wrap: anywhere; }
.mistake .ma .wrong { background: var(--crit-soft); }
.mistake .ma .right { background: var(--good-soft); }
.mistake .ma em { display: block; font-style: normal; font-size: 12px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-3); }
.typebar { display: flex; height: 28px; border-radius: var(--r-sm); overflow: hidden; gap: 2px; }
.typebar i { display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 12px; font-weight: 800; color: #fff; min-width: 0; overflow: hidden; white-space: nowrap; }
.mt-Conceptual { background: var(--c4); } .mt-Calculation { background: var(--c1); } .mt-Memory { background: var(--c6); } .mt-Application { background: var(--c5); } .mt-Carelessness { background: var(--c7); }

/* ---------- assignments ---------- */
.task-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); align-items: center; cursor: pointer; }
.task-row:first-child { border-top: 0; }

.task-row .prog .bar { width: 140px; max-width: 40vw; }
.steps { display: flex; flex-direction: column; }
.step { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
.step:first-child { border-top: 0; }
.step .st-main { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

.step.blocked { background: linear-gradient(90deg, var(--warn-soft), transparent 70%); }
.detail-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; align-items: start; }

.member { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }

.avatar { width: 32px; height: 32px; border-radius: 99px; display: grid; place-items: center; font-weight: 800; font-size: 14px; background: var(--accent-soft); color: var(--accent); flex: none; }
.drop { border: 2px dashed var(--line); border-radius: var(--r); padding: 18px; text-align: center; color: var(--ink-2); display: flex; flex-direction: column; gap: 8px; align-items: center; }
.drop.over { border-color: var(--accent-2); background: var(--accent-soft); }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumbs img { width: 72px; height: 72px; object-fit: cover; border-radius: var(--r-sm); border: 1px solid var(--line); }

/* ---------- progress ---------- */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
.kpi { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }

.kpi.level { background: var(--accent); color: var(--accent-ink); }
.kpi.level .k, .kpi.level .s { color: var(--accent-ink); opacity: 0.85; }
.kpi.level .xpbar { background: color-mix(in srgb, var(--accent-ink) 25%, transparent); }
.prog-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: start; }

.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.badge { padding: 12px; border-radius: var(--r); background: var(--surface-2); display: flex; flex-direction: column; gap: 4px; }

.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--ink-3); font-family: var(--f-mono); font-size: 11px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .target { stroke: var(--ink-3); stroke-dasharray: 4 4; stroke-width: 1.5; fill: none; }
.mbar { display: grid; grid-template-columns: 120px minmax(0, 1fr) 44px; gap: 10px; align-items: center; padding: 6px 0; font-size: 14px; }

.report-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.report-cols h4 { font-size: 14px; display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
.report-cols ul { margin: 0; padding: 0 0 0 18px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }

/* ---------- onboarding ---------- */
.num-badge { width: 32px; height: 32px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--f-display); font-weight: 900; font-size: 15px; }
.onb { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; padding-top: 8px; }
.onb-hero h1 { font-size: clamp(32px, 5vw, 52px); }
.onb-hero p { font-size: 18px; color: var(--ink-2); margin-top: 10px; max-width: 60ch; }
.onb-step { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 16px; }
.onb-step .n { width: 40px; height: 40px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--f-display); font-weight: 900; font-size: 18px; }
.daygrid { display: grid; grid-template-columns: 60px repeat(3, minmax(0, 1fr)); gap: 8px; align-items: center; }
.daygrid .h { font-size: 13px; font-weight: 700; color: var(--ink-3); }

/* ---------- overlays ---------- */
.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, #0a0f1c 55%, transparent); }
.sheet { width: min(640px, 100%); max-height: calc(100dvh - 32px); overflow-y: auto; background: var(--surface); border-radius: 10px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; }
.sheet.wide { width: min(860px, 100%); }
.sheet-head { position: sticky; top: 0; z-index: 2; background: var(--surface); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
.sheet-body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
.sheet-foot { position: sticky; bottom: 0; background: var(--surface); padding: 12px 20px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

.focus { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); text-align: center; }
.focus .ring { position: relative; width: min(300px, 70vw); aspect-ratio: 1; max-width: 100%; }
.focus .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.focus .ring .trk { stroke: var(--surface-3); }
.focus .ring .prg { stroke: var(--sc, var(--accent-2)); transition: stroke-dashoffset 1s linear; }
.focus .ring .clock { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-mono); font-size: clamp(44px, 12vw, 72px); font-weight: 700; }
.focus h2 { font-size: clamp(22px, 4vw, 30px); max-width: 24ch; }
.focus .ctrls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

.toasts { position: fixed; z-index: 70; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
.toast { pointer-events: auto; background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: var(--r); box-shadow: var(--shadow-lg); font-weight: 700; font-size: 15px; max-width: min(380px, calc(100vw - 32px)); display: flex; gap: 10px; align-items: center; }
.toast.xp { background: var(--hi); color: var(--hi-ink); }
.toast.err { background: var(--crit); color: #fff; }
.toast .xpn { font-family: var(--f-mono); font-weight: 700; }
.confetti { position: fixed; inset: 0; z-index: 80; pointer-events: none; width: 100%; height: 100%; }
.spin { width: 18px; height: 18px; border: 2.5px solid currentColor; border-right-color: transparent; border-radius: 99px; animation: sp 0.8s linear infinite; display: inline-block; flex: none; }
@keyframes sp { to { transform: rotate(360deg); } }
.searchres { display: flex; flex-direction: column; }
.searchres button { display: flex; gap: 12px; align-items: center; text-align: left; border: 0; background: none; padding: 10px 6px; border-top: 1px solid var(--line); border-radius: 0; }
.searchres button:hover { background: var(--surface-2); }
.searchres .tag { flex: none; }

/* ---------- responsive ---------- */
@media (max-width: 1080px) {
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .kpis .kpi.level { grid-column: span 3; }
}
@media (max-width: 960px) {
  .today-grid, .detail-grid, .prog-grid { grid-template-columns: minmax(0, 1fr); }
  .report-cols { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 860px) {

  .sidebar { display: none; }
  .mobile-brand { display: flex; }
  .topbar-in { flex-wrap: wrap; }
  .topbar .mobile-brand { width: 100%; align-items: center; justify-content: space-between; }
  .topbar .mobile-brand .brand { padding: 0; font-size: 20px; }
  .content { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
  .bottomnav {
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;

    padding-block: 6px calc(6px + env(safe-area-inset-bottom, 0px)); padding-left: max(4px, env(safe-area-inset-left, 0px)); padding-right: max(4px, env(safe-area-inset-right, 0px));
  }
  .bottomnav button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; font-size: 12px; font-weight: 700; color: var(--ink-3); border-radius: var(--r); min-height: 50px; position: relative; }

<script>
window.SF_WEB = true;
(function (root) {
  const SF = {};

  // ---------- time ----------
  SF._now = null;
  SF.now = () => (SF._now ? new Date(SF._now) : new Date());
  const pad = (n) => String(n).padStart(2, "0");
  SF.iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  SF.today = () => SF.iso(SF.now());
  SF.parse = (s) => {
    const [y, m, d] = String(s).split("-").map(Number);
    return new Date(y, m - 1, d);
  };
  SF.addDays = (s, n) => {
    const d = SF.parse(s);
    d.setDate(d.getDate() + n);
    return SF.iso(d);
  };
  SF.diff = (a, b) => {
    const A = SF.parse(a), B = SF.parse(b);
    return Math.round((Date.UTC(B.getFullYear(), B.getMonth(), B.getDate()) - Date.UTC(A.getFullYear(), A.getMonth(), A.getDate())) / 864e5);
  };
  SF.wd = (s) => SF.parse(s).getDay();
  SF.DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  SF.DAYS_LONG = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  SF.MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  SF.MONTHS_LONG = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  SF.fmtDay = (s) => {
    const d = SF.parse(s);
    return `${SF.DAYS[d.getDay()]} ${d.getDate()} ${SF.MONTHS[d.getMonth()]}`;
  };
  SF.fmtLong = (s) => {
    const d = SF.parse(s);
    return `${SF.DAYS_LONG[d.getDay()]} ${d.getDate()} ${SF.MONTHS_LONG[d.getMonth()]}`;
  };
  SF.relDay = (s, today) => {
    const n = SF.diff(today || SF.today(), s);
    if (n === 0) return "Today";
    if (n === 1) return "Tomorrow";
    if (n === -1) return "Yesterday";
    if (n < 0) return `${-n} days ago`;
    if (n < 7) return SF.DAYS_LONG[SF.wd(s)];
    return `in ${n} days`;
  };
  SF.toMin = (t) => {
    const [h, m] = String(t || "0:0").split(":").map(Number);
    return (h || 0) * 60 + (m || 0);
  };
  SF.fromMin = (m) => `${pad(Math.floor(m / 60) % 24)}:${pad(Math.round(m) % 60)}`;
  SF.dur = (m) => {
    m = Math.round(m || 0);
    if (m < 60) return `${m} min`;
    const h = Math.floor(m / 60), r = m % 60;
    return r ? `${h}h ${r}m` : `${h}h`;
  };
  SF.nowMin = () => {
    const d = SF.now();
    return d.getHours() * 60 + d.getMinutes();
  };
  SF.weekStart = (s) => SF.addDays(s, -((SF.wd(s) + 6) % 7));
  SF.weekNo = (s) => {
    const d = SF.parse(s);
    const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const day = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - day);
    const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return Math.ceil(((t - y0) / 864e5 + 1) / 7);
  };
  SF.uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  SF.clamp = clamp;

  // ---------- defaults ----------
  SF.defaultSettings = () => ({
    days: {
      0: { start: "10:00", end: "18:00", max: 120 },
      1: { start: "16:30", end: "21:00", max: 120 },
      2: { start: "16:30", end: "21:00", max: 120 },
      3: { start: "16:30", end: "21:00", max: 120 },
      4: { start: "16:30", end: "21:00", max: 120 },
      5: { start: "16:30", end: "21:00", max: 120 },
      6: { start: "10:00", end: "18:00", max: 150 },
    },
    session: 40,
    brk: 5,
    lead: 14,
  });

  SF.blankState = () => ({
    meta: {
      v: 1,
      name: "",
      isExample: false,
      onboarded: false,
      xp: 0,
      xpLog: [],
      activeDays: [],
      achievements: [],
      challenges: [],
      settings: SF.defaultSettings(),
      activities: [],
      overrides: {},
      planLog: {},
      createdAt: SF.today(),
    },
    subjects: [],
    tasks: [],
    exams: [],
    assessments: [],
    cards: [],
    mistakes: [],
    resources: [],
    log: { sessions: [], reviews: [] },
  });

  SF.normalize = (s) => {
    const b = SF.blankState();
    s = s && typeof s === "object" ? s : {};
    const out = {
      meta: Object.assign(b.meta, s.meta || {}),
      subjects: Array.isArray(s.subjects) ? s.subjects : [],
      tasks: Array.isArray(s.tasks) ? s.tasks : [],
      exams: Array.isArray(s.exams) ? s.exams : [],
      assessments: Array.isArray(s.assessments) ? s.assessments : [],
      cards: Array.isArray(s.cards) ? s.cards : [],
      mistakes: Array.isArray(s.mistakes) ? s.mistakes : [],
      resources: Array.isArray(s.resources) ? s.resources : [],
      log: Object.assign({ sessions: [], reviews: [] }, s.log || {}),
    };
    const st = out.meta.settings || {};
    const def = SF.defaultSettings();
    out.meta.settings = Object.assign(def, st, { days: Object.assign(def.days, st.days || {}) });
    for (const k of ["xpLog", "activeDays", "achievements", "challenges", "activities"]) if (!Array.isArray(out.meta[k])) out.meta[k] = [];
    for (const k of ["overrides", "planLog"]) if (!out.meta[k] || typeof out.meta[k] !== "object") out.meta[k] = {};
    for (const sub of out.subjects) {
      if (!Array.isArray(sub.chapters)) sub.chapters = [];
      for (const ch of sub.chapters) if (!Array.isArray(ch.topics)) ch.topics = [];
    }
    return out;
  };

  SF.hasData = (s) => !!(s && (s.subjects.length || s.tasks.length || s.exams.length || s.cards.length));

  // ---------- subjects ----------
  SF.SUBJECT_COLORS = ["c1", "c2", "c3", "c4", "c5", "c6", "c7", "c8"];
  SF.KINDS = {
    math: "Maths",
    science: "Science",
    english: "English / literature",
    language: "Language",
    history: "History",
    geography: "Geography",
    ict: "ICT / computing / design",
    arts: "Arts / music / PE",
    other: "Other",
  };
  SF.guessKind = (name) => {
    const n = String(name).toLowerCase();
    if (/robot/.test(n)) return "ict";
    if (/film|self.?defen|wellbeing|well-being/.test(n)) return "arts";
    if (/global perspective/.test(n)) return "history";
    if (/math|algebra|geometry|calculus|statistic/.test(n)) return "math";
    if (/\bart\b|music|drama|\bpe\b|physical ed|dance|theatre|sport/.test(n)) return "arts";
    if (/ict|comput|coding|\bcs\b|\bdt\b/.test(n)) return "ict";
    if (/bio|chem|phys|science|environment/.test(n)) return "science";
    if (/english|literature|lit\b/.test(n)) return "english";
    if (/french|spanish|german|hindi|mandarin|chinese|japanese|arabic|latin|marathi|sanskrit|italian|language/.test(n)) return "language";
    if (/history|civics|politic|social stud/.test(n)) return "history";
    if (/geog/.test(n)) return "geography";
    if (/ict|comput|coding|design|tech|\bcs\b|\bdt\b/.test(n)) return "ict";
    if (/art|music|drama|\bpe\b|physical|dance|theatre|sport/.test(n)) return "arts";
    return "other";
  };
  const ALIASES = {
    math: ["math", "maths", "mathematics"],
    biology: ["bio", "biol"],
    chemistry: ["chem"],
    physics: ["phys", "phy"],
    english: ["eng", "lit", "ela"],
    history: ["hist"],
    geography: ["geo", "geog"],
    ict: ["ict"],
    "computer science": ["cs", "comp", "compsci", "coding"],
    "global perspectives": ["gp", "global"],
    "thinking skills": ["ts", "thinking"],
    "business": ["bs", "bus", "biz"],
    "robotics": ["robo"],
    "self defence": ["sd", "selfdefence", "defence"],
    "student wellbeing": ["wellbeing", "sw"],
    "film club": ["film"],
    "english language": ["lang", "el"],
    "english literature": ["lit", "elit"],
    french: ["fr", "fre"],
    spanish: ["es", "spa", "span"],
    german: ["ger", "de"],
    hindi: ["hin"],
    economics: ["econ", "eco"],
    "physical education": ["pe"],
    design: ["dt", "design"],
    music: ["mus"],
    drama: ["drama"],
    art: ["art"],
  };
  SF.matchSubject = (token, subjects) => {
    const t = token.toLowerCase().replace(/[^a-z]/g, "");
    if (t.length < 2) return null;
    for (const s of subjects) {
      const n = s.name.toLowerCase();
      const first = n.split(/\s+/)[0];
      if (t === n || t === first) return s;
    }
    for (const s of subjects) {
      const n = s.name.toLowerCase();
      for (const [key, list] of Object.entries(ALIASES)) {
        if (n === key && list.includes(t)) return s;
      }
    }
    if (t.length >= 3) for (const s of subjects) if (s.name.toLowerCase().split(/[\s&]+/).slice(1).some((w) => w.length >= 3 && w.startsWith(t))) return s;
    for (const s of subjects) {
      const n = s.name.toLowerCase();
      for (const [key, list] of Object.entries(ALIASES)) {
        if ((n.includes(key) || key.includes(n)) && list.includes(t)) return s;
      }
      if (t.length >= 3 && n.startsWith(t)) return s;
    }
    return null;
  };

  // ---------- index ----------
  SF.index = (state) => {
    const idx = { subjects: {}, topics: {}, chapters: {}, topicState: {}, minByKey: {}, topicStats: {} };
    for (const s of state.subjects) {
      idx.subjects[s.id] = s;
      for (const ch of s.chapters) {
        idx.chapters[ch.id] = Object.assign({ subjectId: s.id }, ch);
        for (const t of ch.topics) idx.topics[t.id] = Object.assign({ subjectId: s.id, chapterId: ch.id, chapterName: ch.name }, t);
      }
    }
    const stats = {};
    for (const r of state.log.reviews) {
      if (!r.t) continue;
      (stats[r.t] = stats[r.t] || []).push(r.ok ? 1 : 0);
    }
    const mist = {};
    for (const m of state.mistakes) if (!m.resolved && m.topicId) mist[m.topicId] = (mist[m.topicId] || 0) + 1;
    for (const id in idx.topics) {
      const arr = (stats[id] || []).slice(-20);
      const st = { n: arr.length, ok: arr.reduce((a, b) => a + b, 0), m: mist[id] || 0 };
      idx.topicStats[id] = st;
      idx.topicState[id] = SF.topicState(idx.topics[id], st);
    }
    for (const s of state.log.sessions) idx.minByKey[s.key] = (idx.minByKey[s.key] || 0) + (s.min || 0);
    return idx;
  };

  // ---------- mastery ----------
  SF.STATUS = { ns: "Not started", learning: "Learning", revise: "Needs revision", mastered: "Mastered" };
  SF.STATE_LABEL = { ns: "Not started", learning: "Learning", revise: "Needs revision", good: "Understood", mastered: "Mastered", weak: "Weak" };
  SF.topicState = (topic, st) => {
    const status = topic.status || "ns";
    const base = { ns: 0, learning: 0.35, revise: 0.5, mastered: 0.85 }[status] ?? 0;
    const conf = topic.confidence ? topic.confidence / 5 : null;
    const n = st.n || 0;
    const acc = n ? st.ok / n : null;
    const m = st.m || 0;
    let score;
    if (n >= 3) score = 0.4 * acc + 0.3 * (conf ?? base) + 0.3 * base;
    else score = conf !== null ? 0.5 * conf + 0.5 * base : base;
    score = clamp(score - Math.min(0.3, 0.08 * m), 0, 1);
    let state;
    if (status === "ns" && n === 0 && conf === null && m === 0) state = "ns";
    else if (m >= 2 || (n >= 4 && acc < 0.5) || (conf !== null && conf <= 0.2) || (m >= 1 && ((conf !== null && conf <= 0.4) || (n >= 3 && acc < 0.6)))) state = "weak";
    else if (status === "learning" && n < 3) state = "learning";
    else if (score >= 0.8 && m === 0) state = "mastered";
    else if (score < 0.6) state = "revise";
    else state = "good";
    return { score, state, acc, n, m };
  };
  SF.revisionNeed = (topic, ts) => ({ ns: 60, learning: 45, revise: 40, mastered: 15 }[topic.status || "ns"] ?? 45) + (ts && ts.state === "weak" ? 20 : 0);

  SF.subjectTopics = (sub) => sub.chapters.flatMap((c) => c.topics);

  // ---------- capacity ----------
  SF.activitiesOn = (state, iso) =>
    (state.meta.activities || []).filter((a) => (a.date ? a.date === iso : (a.days || []).includes(SF.wd(iso))));

  SF.daySlots = (state, iso, fromMin) => {
    const cfg = state.meta.settings.days[SF.wd(iso)] || { start: "16:30", end: "21:00", max: 0 };
    let s = SF.toMin(cfg.start), e = SF.toMin(cfg.end);
    const acts = SF.activitiesOn(state, iso)
      .map((a) => [SF.toMin(a.start), SF.toMin(a.end), a])
      .sort((x, y) => x[0] - y[0]);
    const win = [s, e];
    if (fromMin != null) s = Math.max(s, fromMin);
    let slots = e - s >= 10 && cfg.max > 0 ? [[s, e]] : [];
    for (const [as, ae] of acts) {
      slots = slots.flatMap(([a, b]) => (ae <= a || as >= b ? [[a, b]] : [[a, Math.min(b, as)], [Math.max(a, ae), b]]));
    }
    slots = slots.filter(([a, b]) => b - a >= 10);
    return { slots, max: cfg.max || 0, acts: acts.map((x) => x[2]), win };
  };

  SF.studiedOn = (state, iso) => state.log.sessions.filter((s) => s.date === iso).reduce((a, s) => a + (s.min || 0), 0);

  SF.capacity = (state, iso, live) => {
    const fromMin = live ? Math.ceil(SF.nowMin() / 5) * 5 : null;
    const { slots, max } = SF.daySlots(state, iso, fromMin);
    const slotTotal = slots.reduce((a, [x, y]) => a + y - x, 0);
    const left = Math.max(0, max - (live ? SF.studiedOn(state, iso) : 0));
    const sess = state.meta.settings.session || 40, brk = state.meta.settings.brk || 0;
    const raw = Math.min(left, slotTotal);
    const breaks = brk * Math.max(0, Math.ceil(raw / sess) - 1);
    const cap = Math.min(left, Math.max(0, slotTotal - breaks));
    return { cap: Math.floor(cap / 5) * 5, slots, max };
  };

  // ---------- reviews ----------
  SF.INTERVALS = [0, 1, 2, 4, 8, 16, 32, 64];
  SF.dueReviews = (state, today) => {
    const out = [];
    for (const c of state.cards) if (!c.suspended && (!c.due || c.due <= today)) out.push({ type: "card", id: c.id, ref: c });
    for (const m of state.mistakes) if (!m.resolved && (!m.due || m.due <= today)) out.push({ type: "mistake", id: m.id, ref: m });
    return out;
  };
  SF.nextInterval = (box, rating) => {
    box = box || 0;
    if (rating === "again") return { box: 1, days: 1 };
    if (rating === "hard") {
      const b = Math.max(1, box);
      return { box: b, days: Math.max(1, Math.round(SF.INTERVALS[b] / 2)) };
    }
    if (rating === "good") {
      const b = Math.min(7, box + 1);
      return { box: b, days: SF.INTERVALS[b] };
    }
    const b = Math.min(7, box + 2);
    return { box: b, days: SF.INTERVALS[b] };
  };
  SF.rate = (item, rating, today) => {
    const { box, days } = SF.nextInterval(item.box, rating);
    item.box = box;
    item.due = SF.addDays(today, days);
    item.reps = (item.reps || 0) + 1;
    if (rating === "again") item.lapses = (item.lapses || 0) + 1;
    item.history = (item.history || []).concat([{ d: today, r: rating }]).slice(-12);
    return item;
  };

  // ---------- planner ----------
  SF.workItems = (state, today, idx) => {
    const items = [], blocked = [];
    const clampDue = (d) => (!d || d < today ? today : d);
    for (const t of state.tasks) {
      if (t.completedAt) continue;
      const due0 = t.personalDue && t.personalDue < t.due ? t.personalDue : t.due;
      const overdue = t.due < today;
      const dp = Number(t.difficulty) || 2;
      if (t.steps && t.steps.length) {
        const byId = Object.fromEntries(t.steps.map((s) => [s.id, s]));
        let prevDue = null;
        t.steps.forEach((s, i) => {
          const windowFrom = prevDue;
          if (s.due) prevDue = s.due;
          if (s.done) return;
          if (s.assignee && s.assignee !== "me") return;
          const deps = (s.dependsOn || []).map((id) => byId[id]).filter((d) => d && !d.done);
          const others = deps.filter((d) => d.assignee && d.assignee !== "me");
          const remaining = Math.max(0, (Number(s.min) || 0) - (Number(s.doneMin) || 0));
          const item = {
            key: `s:${t.id}:${s.id}`, kind: "step", title: s.title, parent: t.title, subjectId: t.subjectId,
            taskId: t.id, stepId: s.id, due: clampDue(s.due && s.due < due0 ? s.due : s.due || due0), realDue: t.due,
            remaining, prio: dp + (overdue ? 3 : 0), order: i, overdue,
            from: s.due && windowFrom && windowFrom > today ? windowFrom : null,
            deps: deps.filter((d) => !others.includes(d)).map((d) => `s:${t.id}:${d.id}`),
          };
          if (others.length) {
            item.blockedBy = others;
            blocked.push(item);
            return;
          }
          if (remaining > 0) items.push(item);
        });
      } else {
        const remaining = Math.max(0, (Number(t.estimate) || 0) - (Number(t.done) || 0));
        if (remaining > 0)
          items.push({
            key: `t:${t.id}`, kind: "task", title: t.title, subjectId: t.subjectId, taskId: t.id,
            due: clampDue(due0), realDue: t.due, remaining, prio: dp + (overdue ? 3 : 0), order: 0, deps: [], overdue,
          });
      }
    }
    for (const ex of state.exams) {
      if (ex.done || ex.date < today) continue;
      const sub = idx.subjects[ex.subjectId];
      if (!sub) continue;
      const ids = ex.topicIds && ex.topicIds.length ? ex.topicIds : SF.subjectTopics(sub).map((t) => t.id);
      const due = ex.date <= SF.addDays(today, 1) ? today : SF.addDays(ex.date, -1);
      const from = SF.addDays(ex.date, -(state.meta.settings.lead || 14));
      ids.map((id) => idx.topics[id]).filter(Boolean).forEach((tp, i) => {
        const ts = idx.topicState[tp.id];
        const key = `r:${ex.id}:${tp.id}`;
        const remaining = Math.max(0, SF.revisionNeed(tp, ts) - (idx.minByKey[key] || 0));
        if (remaining <= 0) return;
        const weak = ts.state === "weak";
        items.push({
          key, kind: "revision", title: `Revise ${tp.name}`, parent: ex.title, subjectId: ex.subjectId, examId: ex.id,
          topicId: tp.id, due, realDue: ex.date, from, remaining, weak, state: ts.state,
          prio: 1.5 + (weak ? 2 : ts.state === "revise" || ts.state === "ns" ? 1 : 0), order: i, deps: [],
        });
      });
    }
    const ov = state.meta.overrides || {};
    for (const it of items) {
      const o = ov[it.key];
      if (!o) continue;
      if (o.notBefore && o.notBefore > today) it.from = it.from && it.from > o.notBefore ? it.from : o.notBefore;
      if (o.prefer) it.preferOn = o.prefer;
    }
    return { items, blocked };
  };

  SF.plan = (state, opts) => {
    opts = opts || {};
    const today = opts.today || SF.today();
    const idx = opts.idx || SF.index(state);
    const { items, blocked } = SF.workItems(state, today, idx);
    const due = SF.dueReviews(state, today).length;
    if (due > 0 && !(state.meta.overrides[`v:${today}`] && state.meta.overrides[`v:${today}`].notBefore > today)) {
      items.push({
        key: `v:${today}`, kind: "review", title: `Review ${due} card${due === 1 ? "" : "s"} and mistakes`,
        due: today, remaining: clamp(Math.ceil((due * 0.75) / 5) * 5, 5, 30), prio: 2.5, order: 0, deps: [],
      });
    }
    const byKey = Object.fromEntries(items.map((i) => [i.key, i]));
    const maxDue = items.reduce((m, i) => (i.due > m ? i.due : m), today);
    const horizon = clamp(SF.diff(today, maxDue) + 1, opts.minDays || 14, 60);
    const rem = new Map(items.map((i) => [i.key, i.remaining]));
    const days = {};
    const allocDay = (iso, cap) => {
      let left = cap;
      const per = new Map();
      const elig = items
        .filter((i) => (!i.from || i.from <= iso) && i.due >= iso)
        .sort((a, b) => {
          const pa = a.preferOn === iso ? 1 : 0, pb = b.preferOn === iso ? 1 : 0;
          if (pa !== pb) return pb - pa;
          if (a.due !== b.due) return a.due < b.due ? -1 : 1;
          if (b.prio !== a.prio) return b.prio - a.prio;
          return a.order - b.order;
        });
      let progress = true;
      while (left >= 10 && progress) {
        progress = false;
        for (const it of elig) {
          if (left < 5) break;
          const r = rem.get(it.key);
          if (!(r > 0)) continue;
          if (it.deps.some((d) => rem.get(d) > 0)) continue;
          const dueIn = SF.diff(iso, it.due);
          const capItem = dueIn <= 1 || it.kind === "review" || it.preferOn === iso ? Infinity : it.kind === "revision" ? 45 : 90;
          const used = per.get(it.key) || 0;
          let amt = Math.min(r, left, capItem - used);
          if (amt < r) amt = Math.floor(amt / 5) * 5;
          if (amt <= 0 || (amt < 10 && amt < r)) continue;
          rem.set(it.key, r - amt);
          left -= amt;
          per.set(it.key, used + amt);
          progress = true;
        }
      }
      return { per, left };
    };
    for (let k = 0; k < horizon; k++) {
      const iso = SF.addDays(today, k);
      const live = k === 0 && !opts.wholeDay;
      let { cap } = SF.capacity(state, iso, live);
      let per, left;
      for (let tries = 0; tries < 4; tries++) {
        const snap = new Map(rem);
        ({ per, left } = allocDay(iso, cap));
        if (k > 0) break;
        const alloc0 = [...per].map(([key, min]) => ({ key, min, item: byKey[key] }));
        const lay = SF.layoutDay(state, iso, alloc0, live);
        const unplaced = lay.sessions.filter((x) => x.start == null).reduce((a, x) => a + x.min, 0);
        if (!unplaced || tries === 3) break;
        rem.clear();
        for (const [kk, vv] of snap) rem.set(kk, vv);
        cap = Math.max(0, cap - Math.ceil(unplaced / 5) * 5);
      }
      const alloc = [...per].map(([key, min]) => ({ key, min, item: byKey[key] }));
      const deadlines = state.tasks.filter((t) => !t.completedAt && t.due === iso).length + state.exams.filter((e) => !e.done && e.date === iso).length;
      days[iso] = { cap, total: cap - left, alloc, deadlines };
    }
    const atRisk = items.filter((i) => i.kind !== "review" && rem.get(i.key) > 0).map((i) => ({ item: i, short: rem.get(i.key) }));
    for (const iso of Object.keys(days)) {
      const d = days[iso];
      d.crunch = d.total >= 0.9 * d.cap && d.cap > 0 && atRisk.some((r) => r.short >= 10 && r.item.due >= iso && SF.diff(iso, r.item.due) <= 2 && (!r.item.from || r.item.from <= iso));
    }
    return { today, days, atRisk, blocked, items, idx };
  };

  SF.loadLabel = (total, cap, maxMin, crunch) => {
    const ref = Math.max(cap, maxMin || 0, 1);
    const r = total / ref;
    if (crunch) return { key: "heavy", label: "Heavy" };
    if (total === 0) return { key: "free", label: "Free" };
    if (r < 0.4) return { key: "light", label: "Light" };
    if (r < 0.75) return { key: "ok", label: "Manageable" };
    return { key: "busy", label: "Busy" };
  };

  SF.layoutDay = (state, iso, alloc, live) => {
    const fromMin = live ? Math.ceil(SF.nowMin() / 5) * 5 : null;
    const { slots, acts, win } = SF.daySlots(state, iso, fromMin);
    const sessLen = state.meta.settings.session || 40, brk = state.meta.settings.brk || 0;
    const chunks = [];
    for (const a of alloc) {
      let m = a.min;
      const n = Math.max(1, Math.round(m / sessLen));
      const size = Math.ceil(m / n / 5) * 5;
      while (m > 0) {
        const c = Math.min(size, m);
        if (c < 10 && chunks.length && chunks[chunks.length - 1].key === a.key) chunks[chunks.length - 1].min += c;
        else chunks.push({ key: a.key, min: c, item: a.item });
        m -= c;
      }
    }
    const out = [];
    let si = 0, cur = slots.length ? slots[0][0] : 0;
    for (const ch of chunks) {
      let need = ch.min;
      while (need > 0 && si < slots.length) {
        const end = slots[si][1];
        const room = end - cur;
        if (room >= need) {
          out.push({ key: ch.key, item: ch.item, start: cur, end: cur + need, min: need });
          cur += need + brk;
          need = 0;
        } else if (room >= 15) {
          out.push({ key: ch.key, item: ch.item, start: cur, end: end, min: room });
          need -= room;
          si++;
          cur = si < slots.length ? slots[si][0] : 0;
        } else {
          si++;
          cur = si < slots.length ? slots[si][0] : 0;
        }
        if (si < slots.length && cur >= slots[si][1]) {
          si++;
          cur = si < slots.length ? slots[si][0] : 0;
        }
      }
      if (need > 0) out.push({ key: ch.key, item: ch.item, start: null, end: null, min: need });
    }
    return { sessions: out, acts, win };
  };

  // ---------- grades ----------
  SF.gradeSummary = (state, subjectId) => {
    const list = state.assessments.filter((a) => a.subjectId === subjectId);
    const done = list.filter((a) => a.status !== "upcoming" && a.max > 0 && a.score !== "" && a.score != null);
    const upcoming = list.filter((a) => a.status === "upcoming");
    const anyW = list.some((a) => Number(a.weight) > 0);
    const w = (a) => (anyW ? Number(a.weight) || 0 : 1);
    const pct = (a) => (Number(a.score) / Number(a.max)) * 100;
    const wDone = done.reduce((s, a) => s + w(a), 0);
    const wUp = upcoming.reduce((s, a) => s + w(a), 0);
    const wTotal = wDone + wUp;
    const pts = done.reduce((s, a) => s + w(a) * pct(a), 0);
    const avg = wDone > 0 ? pts / wDone : null;
    const sub = state.subjects.find((s) => s.id === subjectId);
    const target = sub && sub.target ? Number(sub.target) : null;
    let needed = null, maxPossible = null, verdict = null;
    if (target != null && wUp > 0) {
      needed = (target * wTotal - pts) / wUp;
      maxPossible = (pts + 100 * wUp) / wTotal;
      if (needed <= 0) verdict = { key: "secured", label: "Already secured" };
      else if (needed > 100) verdict = { key: "impossible", label: "Not possible" };
      else if (avg == null) verdict = { key: "open", label: needed <= 75 ? "Realistic" : "Stretch" };
      else if (needed <= avg + 5) verdict = { key: "realistic", label: "Realistic" };
      else if (needed <= avg + 15) verdict = { key: "stretch", label: "Stretch" };
      else verdict = { key: "hard", label: "Very hard" };
    }
    const sorted = done.slice().sort((a, b) => (a.date < b.date ? -1 : 1));
    const last = sorted[sorted.length - 1], prev = sorted[sorted.length - 2];
    const delta = last && prev ? pct(last) - pct(prev) : null;
    const weightSum = anyW ? list.reduce((s, a) => s + (Number(a.weight) || 0), 0) : null;
    return { list, done: sorted, upcoming, avg, target, needed, maxPossible, verdict, delta, wDone, wUp, weightSum, anyW, pct };
  };

  // ---------- xp ----------
  SF.levelInfo = (xp) => {
    let level = 1, floor = 0, need = 100;
    while (xp >= floor + need) {
      floor += need;
      level++;
      need = 100 + 50 * (level - 1);
    }
    return { level, into: xp - floor, need };
  };
  SF.award = (state, pts, why, key) => {
    const m = state.meta;
    if (key && m.xpLog.some((x) => x.key === key)) return null;
    const before = SF.levelInfo(m.xp).level;
    m.xp += pts;
    m.xpLog.push({ t: SF.today(), pts, why, key: key || null });
    if (m.xpLog.length > 400) m.xpLog = m.xpLog.slice(-400);
    const after = SF.levelInfo(m.xp).level;
    return { pts, why, levelUp: after > before, level: after };
  };
  SF.markActive = (state, iso) => {
    iso = iso || SF.today();
    const a = state.meta.activeDays;
    if (!a.includes(iso)) {
      a.push(iso);
      a.sort();
      if (a.length > 400) state.meta.activeDays = a.slice(-400);
    }
  };
  SF.streak = (state) => {
    const set = new Set(state.meta.activeDays);
    const today = SF.today();
    let d = set.has(today) ? today : SF.addDays(today, -1);
    let n = 0;
    while (set.has(d)) {
      n++;
      d = SF.addDays(d, -1);
    }
    let best = 0, run = 0, prev = null;
    for (const x of state.meta.activeDays) {
      run = prev && SF.diff(prev, x) === 1 ? run + 1 : 1;
      best = Math.max(best, run);
      prev = x;
    }
    return { current: n, best: Math.max(best, n), today: set.has(today) };
  };

  SF.ACHIEVEMENTS = [
    { id: "first-session", name: "First focus", desc: "Finish your first focus session", test: (s) => s.log.sessions.some((x) => x.timer) },
    { id: "streak-3", name: "Three in a row", desc: "Study 3 days in a row", test: (s) => SF.streak(s).best >= 3 },
    { id: "streak-7", name: "Full week", desc: "Study 7 days in a row", test: (s) => SF.streak(s).best >= 7 },
    { id: "early-3", name: "Ahead of the bell", desc: "Finish 3 assignments before the due date", test: (s) => s.tasks.filter((t) => t.completedAt && t.completedAt < t.due).length >= 3 },
    { id: "mistakes-10", name: "Honest logbook", desc: "Log 10 mistakes", test: (s) => s.mistakes.length >= 10 },
    { id: "fixed-5", name: "Fixer", desc: "Fix 5 mistakes", test: (s) => s.mistakes.filter((m) => m.resolved).length >= 5 },
    { id: "cards-100", name: "Centurion", desc: "Answer 100 review questions", test: (s) => s.log.reviews.length >= 100 },
    { id: "weak-fixed", name: "Weak spot, fixed", desc: "Master a topic you had logged mistakes on", test: (s) => {
      const fixed = new Set(s.mistakes.filter((m) => m.resolved && m.topicId).map((m) => m.topicId));
      return s.subjects.some((sub) => SF.subjectTopics(sub).some((t) => t.status === "mastered" && fixed.has(t.id)));
    } },
    { id: "level-5", name: "Level 5", desc: "Reach level 5", test: (s) => SF.levelInfo(s.meta.xp).level >= 5 },
  ];
  SF.checkAchievements = (state) => {
    const got = new Set(state.meta.achievements.map((a) => a.id));
    const fresh = [];
    for (const a of SF.ACHIEVEMENTS) {
      if (got.has(a.id)) continue;
      let ok = false;
      try { ok = a.test(state); } catch (e) { ok = false; }
      if (ok) {
        state.meta.achievements.push({ id: a.id, t: SF.today() });
        fresh.push(a);
      }
    }
    return fresh;
  };

  SF.weekStats = (state, ws) => {
    const we = SF.addDays(ws, 6);
    const inW = (d) => d >= ws && d <= we;
    const sessions = state.log.sessions.filter((s) => inW(s.date));
    const reviews = state.log.reviews.filter((r) => inW(r.d));
    const minutes = sessions.reduce((a, s) => a + (s.min || 0), 0);
    const acc = reviews.length ? reviews.filter((r) => r.ok).length / reviews.length : null;
    const completed = state.tasks.filter((t) => t.completedAt && inW(t.completedAt));
    const early = completed.filter((t) => t.completedAt < t.due);
    const onTime = completed.filter((t) => t.completedAt <= t.due);
    const fixed = state.mistakes.filter((m) => m.resolved && m.resolvedAt && inW(m.resolvedAt));
    const weakRevised = new Set(state.meta.xpLog.filter((x) => x.key && x.key.startsWith("weak:") && inW(x.t)).map((x) => x.key.split(":")[1])).size;
    const planned = sessions.filter((s) => s.planned).length;
    return { ws, we, sessions, reviews, minutes, acc, completed, early, onTime, fixed, weakRevised, planned };
  };

  SF.CHALLENGES = [
    { id: "weak3", name: "Revise 3 weak topics", goal: 3, val: (w) => w.weakRevised },
    { id: "early2", name: "Finish 2 assignments before their due date", goal: 2, val: (w) => w.early.length },
    { id: "sess5", name: "Complete 5 planned sessions", goal: 5, val: (w) => w.planned },
    { id: "rev60", name: "Answer 60 review questions", goal: 60, val: (w) => w.reviews.length },

  const WD = { sun: 0, mon: 1, tue: 2, tues: 2, wed: 3, thu: 4, thur: 4, thurs: 4, fri: 5, sat: 6 };

  const mkDate = (today, d, m, y) => {
    const ty = SF.parse(today).getFullYear();
    let year = y ? (y < 100 ? 2000 + y : y) : ty;
    let s = `${year}-${pad(m + 1)}-${pad(d)}`;
    const chk = SF.parse(s);
    if (chk.getMonth() !== m || chk.getDate() !== d) return null;
    if (!y && s < today) s = `${year + 1}-${pad(m + 1)}-${pad(d)}`;
    return s;
  };
  const to24 = (h, m, ap) => {
    h = Number(h);
    m = Number(m || 0);
    if (ap) {
      ap = ap.toLowerCase();
      if (ap === "pm" && h < 12) h += 12;
      if (ap === "am" && h === 12) h = 0;
    } else if (h < 8) h += 12;
    return `${pad(h)}:${pad(m)}`;
  };
  SF.quickParse = (text, subjects, today) => {
    today = today || SF.today();
    let s = " " + String(text || "").trim() + " ";
    const out = { kind: "homework", title: "", subjectId: null, due: null, dueFound: false, minutes: null, difficulty: 2, days: [], start: null, end: null };
    const cut = (re, fn) => {
      s = s.replace(re, (...a) => {
        const r = fn(...a);
        return r === false ? a[0] : " ";
      });
    };
    cut(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*(?:-|–|to)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\b/i, (m, h1, m1, a1, h2, m2, a2) => {
      if (!m1 && !m2 && !a1 && !a2 && !/\d\s*(?:-|–)\s*\d/.test(m)) return false;
      out.start = to24(h1, m1, a1 || a2);
      out.end = to24(h2, m2, a2);
      out.kind = "activity";
    });
    cut(/\b(\d{4})-(\d{2})-(\d{2})\b/, (m, y, mo, d) => { out.due = `${y}-${mo}-${d}`; out.dueFound = true; });
    cut(/\b(\d{1,2})(?:st|nd|rd|th)?\s+(jan|feb|mar|apr|may|jun|jul|aug|sept?|oct|nov|dec)[a-z]*\.?\b/i, (m, d, mo) => {
      const r = mkDate(today, Number(d), MON[mo.toLowerCase().slice(0, mo.toLowerCase().startsWith("sept") ? 4 : 3)]);
      if (!r) return false;
      out.due = r; out.dueFound = true;
    });
    cut(/\b(jan|feb|mar|apr|may|jun|jul|aug|sept?|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?\b/i, (m, mo, d) => {
      const r = mkDate(today, Number(d), MON[mo.toLowerCase().slice(0, mo.toLowerCase().startsWith("sept") ? 4 : 3)]);
      if (!r) return false;
      out.due = r; out.dueFound = true;
    });
    cut(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/, (m, d, mo, y) => {
      const r = mkDate(today, Number(d), Number(mo) - 1, y ? Number(y) : 0);
      if (!r) return false;
      out.due = r; out.dueFound = true;
    });
    cut(/\b(\d+(?:\.\d+)?)\s*(?:h|hr|hrs|hour|hours)\s*(?:(\d{1,2})\s*(?:m|min|mins|minutes)?)?(?=\s|$)/i, (m, h, mm) => {
      out.minutes = Math.round(Number(h) * 60 + Number(mm || 0));
    });
    cut(/\b(\d{1,3})\s*(?:m|min|mins|minutes)\b/i, (m, mm) => { out.minutes = Number(mm); });
    cut(/\b(today|tonight)\b/i, () => { out.due = today; out.dueFound = true; });
    cut(/\b(tomorrow|tmrw|tmr)\b/i, () => { out.due = SF.addDays(today, 1); out.dueFound = true; });
    cut(/\bnext week\b/i, () => { out.due = SF.addDays(today, 7); out.dueFound = true; });
    cut(/\bin (\d{1,2}) (?:days?|d)\b/i, (m, n) => { out.due = SF.addDays(today, Number(n)); out.dueFound = true; });
    cut(/\bin (\d{1,2}) weeks?\b/i, (m, n) => { out.due = SF.addDays(today, 7 * Number(n)); out.dueFound = true; });
    const wdRe = /\b(?:next |this |every )?(mon|tues?|wed|thu(?:rs?)?|fri|sat|sun)(?:day|days|nesday|nesdays|sday|sdays|urday|urdays|s)?\b/gi;
    s = s.replace(wdRe, (m, w) => {
      const n = WD[w.toLowerCase()];
      if (n === undefined) return m;
      out.days.push(n);
      return " ";
    });
    if (out.days.length && !out.dueFound) {
      out.due = nextWd(today, out.days[0]);
      out.dueFound = true;
    }
    if (/\b(test|exam|quiz|assessment|midterm|mid-term|mock|finals?)\b/i.test(s) && out.kind !== "activity") out.kind = "exam";
    else if (/\bproject\b/i.test(s) && out.kind !== "activity") out.kind = "project";
    else if (/\b(essay|assignment|report|presentation|poster|lab|portfolio|coursework)\b/i.test(s) && out.kind !== "activity") out.kind = "assignment";
    if (/\b(hard|tough|difficult)\b/i.test(s)) { out.difficulty = 3; s = s.replace(/\b(hard|tough|difficult)\b/i, " "); }
    else if (/\b(easy|quick|short)\b/i.test(s)) { out.difficulty = 1; s = s.replace(/\b(easy|quick|short)\b/i, " "); }

    for (let i = 0; i < words.length; i++) {

            else break;
          }
          continue;
        }
      }
      titleWords.push(w);
    }
    out.subjectId = subj ? subj.id : null;
    out.title = titleWords.join(" ").replace(/\s+/g, " ").trim();
    if (!out.title) out.title = subj ? `${subj.name} ${out.kind === "exam" ? "test" : out.kind}` : "";

      this.status = "saving";
    } else if (initial) this.status = "saved";
    return false;
  },
  async wipeCloud() {
    if (this.mode !== "cloud") return;
    const snap = await this.col.limit(1000).get();
    for (const d of snap.docs) await this.col.doc(d.id).delete();
    this.known.clear();
  },
};

function celebrate() {
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("#confetti");
  if (!cv) return;
  const ctx = cv.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr;
  cv.height = innerHeight * dpr;
  cv.hidden = false;
  const cs = getComputedStyle(document.documentElement);
  const cols = ["--c1", "--c2", "--c3", "--c4", "--c5", "--hi"].map((v) => cs.getPropertyValue(v).trim() || "#2f6bff");
  const parts = Array.from({ length: 140 }, () => ({
    x: innerWidth / 2 + (Math.random() - 0.5) * 160, y: innerHeight * 0.38, vx: (Math.random() - 0.5) * 13, vy: -Math.random() * 13 - 4,
    s: 5 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4, c: cols[(Math.random() * cols.length) | 0],
  }));
  const t0 = performance.now();
  const step = (t) => {
    const k = (t - t0) / 1500;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of parts) {
      p.vy += 0.42;
      p.x += p.vx;
      p.y += p.vy;
      p.r += p.vr;
      ctx.save();
      ctx.globalAlpha = Math.max(0, 1 - k);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.r);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      ctx.restore();
    }
    if (k < 1) requestAnimationFrame(step);
    else {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      cv.hidden = true;
    }
  };
  requestAnimationFrame(step);
}

function itemWhy(it, today) {
  const out = [];
  if (!it) return "";
  if (it.kind !== "review") out.push(chip(it.subjectId));
  if (it.kind === "review") out.push(`<span class="pill info">Spaced review</span>`);
  if (it.kind === "revision") {
    const ex = examOf(it.examId);
    if (ex) out.push(`<span>for ${esc(ex.title)} · ${esc(SF.relDay(ex.date, today))}</span>`);
    if (it.weak) out.push(`<span class="pill crit">Weak topic</span>`);
    else if (it.state === "revise") out.push(`<span class="pill warn">Needs revision</span>`);
    else if (it.state === "ns") out.push(`<span class="pill">Not started</span>`);
  }
  if (it.kind === "step" || it.kind === "task") {
    if (it.kind === "step") {
      const t = taskOf(it.taskId);
      if (t) {
        const n = t.steps.findIndex((x) => x.id === it.stepId) + 1;
        out.push(`<span>${esc(t.title)} · step ${n} of ${t.steps.length}</span>`);

    const t = taskOf(it.taskId);
    if (t && Number(t.difficulty) === 3) out.push(`<span class="pill warn">Hard</span>`);
  }
  return out.join("");
}

function radarAlerts(P) {
  const s = st(), today = P.today;
  const out = [];
  for (const r of P.atRisk) {
    if (r.short < 10) continue;
    const it = r.item;
    const name = it.kind === "step" ? `${it.parent}: ${it.title}` : it.kind === "revision" ? `${it.title} (${it.parent})` : it.title;
    const fix = it.kind === "revision"
      ? "Add study time before the test, or mark topics you already know well as Mastered."
      : it.realDue && it.due < it.realDue ? "Add study time on the days before, or move your personal deadline closer to the real one." : "Add study time on the days before, or start sooner by doing a session ahead of plan.";
    out.push({ kind: "crit", html: `<b>${esc(name)}</b> needs ${SF.dur(r.short)} more than you have before ${esc(SF.fmtDay(it.due))}. ${fix}` });
  }
  const keys = Object.keys(P.days).slice(1, 8);
  for (const k of keys) {
    const d = P.days[k];
    const cfg = s.meta.settings.days[SF.wd(k)] || {};
    if (!d.crunch && d.total >= 0.75 * Math.max(d.cap, cfg.max || 0) && d.deadlines >= 2)
      out.push({ kind: "warn", html: `<b>${esc(SF.fmtDay(k))}</b> is busy: ${SF.dur(d.total)} planned and ${plural(d.deadlines, "deadline")}. Don't skip the sessions before it; that's what keeps it from piling up.` });
  }
  for (const b of P.blocked.slice(0, 3)) {
    const t = taskOf(b.taskId);
    const who = b.blockedBy.map((x) => (t.members || []).find((m) => m.id === x.assignee)).filter(Boolean).map((m) => m.name);
    out.push({ kind: "info", html: `<b>${esc(b.title)}</b> (${esc(t.title)}) is waiting on ${esc(who.join(" and ") || "a teammate")}: ${esc(b.blockedBy.map((x) => x.title).join(", "))}.` });
  }
  return out;
}

function examReadiness(ex, idx) {
  const sub = subjOf(ex.subjectId);
  if (!sub) return { pct: 0, ids: [] };
  const ids = ex.topicIds && ex.topicIds.length ? ex.topicIds : SF.subjectTopics(sub).map((t) => t.id);
  const scores = ids.map((id) => (idx.topicState[id] ? idx.topicState[id].score : 0));
  return { pct: scores.length ? (scores.reduce((a, b) => a + b, 0) / scores.length) * 100 : 0, ids };
}
